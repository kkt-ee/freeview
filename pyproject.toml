[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "freeview"
version = "0.0.1"
description = "Interactive FreeSurfer Stats Dashboard"
authors = [ { name = "Freeview Dev", email = "dev@example.com" } ]
requires-python = ">=3.10"
dependencies = ["pandas>=1.3", "streamlit>=1.0", "plotly>=5.0"]

[project.scripts]
freeview = "freeview.cli:main"

[tool.hatch.build.targets.wheel]
include = ["freeview/**", "README.md", "requirements.txt"]
